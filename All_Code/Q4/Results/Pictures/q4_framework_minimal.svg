  <text class="item" x="400" y="223">因果电价预测</text>
  <circle cx="380" cy="270" r="9.5" fill="#EAF1F7"/>
  <text class="num" x="380" y="274" text-anchor="middle">2</text>
  <text class="item" x="400" y="275">三维联合场景</text>
  <circle cx="380" cy="322" r="9.5" fill="#EAF1F7"/>
  <text class="num" x="380" y="326" text-anchor="middle">3</text>
  <text class="item" x="400" y="327">真实逐时段结算</text>

  <circle cx="680" cy="198" r="3.5" fill="#C3D1DC"/>
