<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="430" viewBox="0 0 1680 430">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A9B8C4"/>
    </marker>
    <style>
      .title  { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #1F3B52; }
      .stage  { font: 500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #9AAAB8; letter-spacing: 1.2px; }
      .item   { font: 400 14.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #33475A; }
      .num    { font: 500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #3E6E93; }
      .bh     { font: 700 16.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
      .bd     { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #8FA0AE; }
      .out    { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
      .outs   { font: 400 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill: #9AAAB8; }
    </style>
  </defs>

  <text class="title" x="56" y="46">实时波动电价下的双路径购电优化框架</text>
  <line x1="56" y1="68" x2="1624" y2="68" stroke="#E4EBF0" stroke-width="1"/>

  <text class="stage" x="56" y="140">数据输入</text>
