  <rect x="976" y="160" width="380" height="104" rx="12" fill="#FFFFFF" stroke="#C9DCEA" stroke-width="1"/>
  <rect x="1004" y="193" width="10" height="10" rx="3" fill="#3E6E93"/>
  <text class="bh" x="1026" y="204" fill="#3E6E93">第二小问｜日前风险规避优化</text>
  <text class="bd" x="1026" y="234">每日 0 点确定 144 时段计划</text>

