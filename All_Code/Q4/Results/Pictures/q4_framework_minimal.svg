  <text class="stage" x="1396" y="140">结果输出</text>

  <rect x="56" y="160" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#DCE4EA" stroke-width="1"/>
  <rect x="356" y="160" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#DCE4EA" stroke-width="1"/>
  <rect x="656" y="160" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#DCE4EA" stroke-width="1"/>

  <circle cx="80" cy="218" r="3.5" fill="#C3D1DC"/>
