  <rect x="1396" y="160" width="228" height="104" rx="12" fill="#FFFFFF" stroke="#C9DCEA" stroke-width="1"/>
  <text class="out" x="1420" y="206" fill="#3E6E93">result4-2.xlsx</text>
  <text class="outs" x="1420" y="232">日前购电策略</text>

  <rect x="1396" y="286" width="228" height="104" rx="12" fill="#FFFFFF" stroke="#E5D5BC" stroke-width="1"/>
  <text class="out" x="1420" y="332" fill="#C08430">result4-3.xlsx</text>
  <text class="outs" x="1420" y="358">滚动调整策略</text>

